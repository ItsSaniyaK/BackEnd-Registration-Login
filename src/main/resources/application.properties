server.port=8081

# ------------------------------------------------------------
# MySQL (localhost)
# NOTE: DB is auto-created if it does not exist (createDatabaseIfNotExist)
# Override credentials with env vars if yours differ:
#   DB_USERNAME, DB_PASSWORD
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/user_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Saniya}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables are created/updated automatically by Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
# Quote all identifiers so the `user` table name never collides with the MySQL keyword
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ------------------------------------------------------------
# JWT settings (secret must be at least 32 bytes for HS256)
# ------------------------------------------------------------
app.jwt.secret=change-me-this-secret-must-be-at-least-32-bytes-long-0123456789
app.jwt.expiration-hours=24
app.jwt.cookie-name=jwt_token

# ------------------------------------------------------------
# CORS (used for direct browser calls from the React dev server)
# ------------------------------------------------------------
app.cors.allowed-origin=http://localhost:5173

# Name the two logical services for logging/visibility
spring.application.name=user-auth-backend